[project]
name = "jepra"
version = "0.1.0"
description = "越境BtoB向けのリード収集・アプローチ・効果測定パイプライン"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# 実データ収集(overpass/google)とサイト巡回に必要。demo/statsだけなら不要。
# HTML解析は標準ライブラリで済ませているため、追加はHTTPクライアントのみ。
live = ["requests>=2.28"]

[project.scripts]
jepra = "jepra.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jepra = ["fixtures/*.json"]
